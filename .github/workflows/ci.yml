name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2
  # The pre-commit hook is for local commits; don't install it on CI checkouts.
  HUSKY: "0"

jobs:
  verify:
    name: Type check, Biome, Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run verify

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same image as `bun run test:e2e:linux`, so the Linux screenshot baselines match. Keep the tag in
    # step with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install --global --silent bun@${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Builds the app with the /e2e pages on and runs it against a local Convex stub (no secrets needed).
      - run: bun run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
