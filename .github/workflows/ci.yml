name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2
  # The pre-commit hook is for local commits; don't install it on CI checkouts.
  HUSKY: "0"

jobs:
  verify:
    name: Type check, Biome, Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run verify

  changes:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull_request checkout is a merge commit whose first parent is the base branch tip.
          fetch-depth: 2
      - id: diff
        name: Decide whether e2e runs
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Pushes to main always run e2e. On a PR, skip it only when every changed file is docs.
          if [ "$EVENT" != "pull_request" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          code=$(echo "$changed" | grep -Ev '^docs/|\.md$' || true)
          if [ -z "$code" ]; then
            echo "Docs-only change: skipping e2e."
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Playwright shard ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Same image as `bun run test:e2e:linux`, so the Linux screenshot baselines match. Keep the tag in
    # step with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install --global --silent bun@${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Builds the app with the /e2e pages on and runs it against a local Convex stub (no secrets needed).
      - run: bun run test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Branch protection requires a check named exactly "Playwright". It passes when every shard passed, or when
  # the PR only touches docs and the shards were skipped on purpose.
  e2e-result:
    name: Playwright
    needs: [changes, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RUN_E2E: ${{ needs.changes.outputs.e2e }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "changes=$CHANGES run_e2e=$RUN_E2E e2e=$E2E"
          if [ "$CHANGES" != "success" ]; then exit 1; fi
          if [ "$RUN_E2E" = "false" ] && [ "$E2E" = "skipped" ]; then exit 0; fi
          [ "$E2E" = "success" ]
